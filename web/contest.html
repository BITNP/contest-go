<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>答题 - 国防知识竞赛</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="wrap">
    <strong>答题</strong>
    <div class="spacer"></div>
    <a href="/">首页</a>
    <a href="/info">历史成绩</a>
  </div>
</header>
<main class="wrap">
  <div class="card" id="status-card">
    <h1 id="attempt-title">正在加载试卷……</h1>
    <p class="muted" id="deadline-text"></p>
    <div class="bar"><span id="time-bar"></span></div>
    <p class="muted">剩余题目：<span id="progress-text">-</span></p>
    <div class="bar"><span id="progress-bar"></span></div>
  </div>
  <div id="error" class="card error" style="display:none"></div>
  <form id="exam-form"></form>
  <div class="card">
    <button id="submit-btn" type="button">提交试卷</button>
    <p class="muted" id="save-status"></p>
  </div>
</main>
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2>提交确认</h2>
    <p id="modal-text">确定提交吗？提交后不能再修改。</p>
    <div class="row">
      <button id="confirm-submit" type="button">确定提交</button>
      <button id="cancel-submit" type="button" style="background:#78716c">继续答题</button>
    </div>
  </div>
</div>
<script src="/static/contest.js"></script>
</body>
</html>
